<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국어 발음 쉐도잉</title>
<style>
body { margin: 0; background: #171b24; }
:root {
  --bg: #171b24;
  --surface: #1f2430;
  --surface-2: #272d3c;
  --border: #383f52;
  --text: #edf0f5;
  --text-dim: #98a1b8;
  --text-faint: #656d84;
  --gold: #e3b158;
  --blue: #7fa6e0;
  --teal: #5cc9a7;
  --purple: #b58bd8;
  --rose: #e08fae;
  --gray: #8890a3;
  --coral: #e2685a;
  --serif: "Nanum Myeongjo", "Noto Serif KR", "Apple SD Gothic Neo", serif;
  --sans: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
.app-shell {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  border-radius: 16px;
  padding: 36px 28px;
  max-width: 720px;
  margin: 0 auto;
  line-height: 1.6;
}
*, *::before, *::after { box-sizing: border-box; }

.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.lang-toggle { display: flex; gap: 6px; }
.settings-toggle {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  width: 34px; height: 34px; font-size: 15px; cursor: pointer; color: var(--text-dim);
}
.settings-toggle:hover { border-color: var(--gold); }
.settings-toggle.active { border-color: var(--gold); color: var(--gold); }
.lang-btn {
  font-size: 12.5px; font-family: var(--sans); background: var(--surface-2); color: var(--text-dim);
  border: 1px solid var(--border); border-radius: 999px; padding: 5px 14px; cursor: pointer;
}
.lang-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(227,177,88,0.1); }

.app-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--gold); text-transform: uppercase; margin-bottom: 10px; }
.app-title { font-family: var(--serif); font-size: 27px; font-weight: 700; margin: 0 0 8px; }
.app-sub { color: var(--text-dim); font-size: 13.5px; margin: 0 0 20px; max-width: 58ch; }

.backend-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 12.5px; color: var(--text-faint);
}
.backend-row input {
  flex: 1; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 6px; padding: 6px 9px; font-family: var(--mono); font-size: 12px;
}
.backend-row input:focus { outline: none; border-color: var(--gold); }

.consent-overlay {
  position: fixed; inset: 0; background: rgba(10,12,18,0.92); z-index: 1000;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.consent-box {
  background: #262d40; border: 1.5px solid #414b64; border-radius: 16px;
  padding: 30px 34px; max-width: 420px; width: 100%; box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 20px 60px rgba(0,0,0,0.6);
}
.consent-box h2 { font-family: var(--serif); font-size: 19px; margin: 0 0 12px; color: var(--text); }
.consent-box p { font-size: 13.5px; color: #c7ccd6; line-height: 1.7; margin: 0 0 20px; }
.consent-box .sd-btn { width: 100%; margin-bottom: 8px; }

.auth-tabs { display: flex; gap: 6px; margin-bottom: 18px; }
.auth-tab {
  flex: 1; background: #3a4258; border: 2px solid transparent; border-radius: 8px;
  padding: 10px; font-size: 14px; font-weight: 700; color: #d7dbe3; cursor: pointer; font-family: var(--sans);
}
.auth-tab.active { background: var(--gold); color: #201705; box-shadow: 0 3px 10px rgba(227,177,88,0.4); }
.auth-field-label {
  display: block; font-family: var(--sans); font-size: 12.5px; color: var(--text); font-weight: 700;
  letter-spacing: .02em; margin: 0 0 6px;
}
.auth-remember { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--text); cursor: pointer; margin-top: 4px; }
.auth-checkbox-native { position: absolute; opacity: 0; width: 0; height: 0; }
.auth-checkbox-box {
  width: 20px; height: 20px; border-radius: 5px; border: 2px solid #8a90a0; background: #eef0f4;
  flex-shrink: 0; position: relative; transition: background .15s, border-color .15s;
}
.auth-checkbox-native:checked + .auth-checkbox-box {
  background: #2563eb; border-color: #2563eb;
}
.auth-checkbox-native:checked + .auth-checkbox-box::after {
  content: ''; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px;
  border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
}

.consent-box .sd-input-editable { border-radius: 999px; padding: 13px 20px; }
.consent-box .sd-btn { border-radius: 999px; }
.consent-box .auth-tab { border-radius: 999px; }
.auth-guest-link {
  display: block; width: 100%; text-align: center; background: none; border: none;
  color: var(--text-dim); font-size: 13px; font-family: var(--sans); cursor: pointer;
  margin-top: 14px; padding: 6px; text-decoration: underline; text-underline-offset: 3px;
}
.auth-guest-link:hover { color: var(--gold); }
.auth-error { color: var(--coral); font-size: 13px; margin-top: 10px; font-weight: 600; }

.account-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 16px; font-size: 13px; color: var(--text-dim);
}

.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-size: 14px; font-weight: 700; font-family: var(--sans);
  cursor: pointer; padding: 9px 16px; margin-bottom: 18px;
}
.back-btn:hover { border-color: var(--gold); color: var(--gold); }

.home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
.home-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 30px 16px; text-align: center; cursor: pointer; transition: border-color .15s, transform .1s;
}
.home-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.home-icon { font-size: 36px; margin-bottom: 10px; }
.home-label { font-family: var(--sans); font-size: 14.5px; font-weight: 700; color: var(--text); }

@media (max-width: 420px) {
  .home-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .home-card { padding: 22px 10px; }
  .home-icon { font-size: 28px; }
}

/* ===== 문장 연습 (sd-*) ===== */
.sd-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-bottom: 18px; }
.sd-card h2 { font-family: var(--serif); font-size: 16.5px; margin: 0 0 12px; }
.sd-cat-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: flex-start; }
.sd-cat-block { display: contents; }
.sd-cat-header {
  display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 14px; font-family: var(--sans); font-size: 14.5px; font-weight: 600; color: var(--text-dim);
}
.sd-cat-header:hover { border-color: var(--gold); }
.sd-cat-header.open { border-color: var(--gold); color: var(--gold); background: rgba(227,177,88,0.08); }
.sd-cat-header .count { font-family: var(--mono); color: var(--text-faint); font-size: 11px; }
.sd-chips {
  display: none; flex-wrap: wrap; gap: 5px; margin: 6px 0 8px 6px; padding: 10px 10px 10px 12px;
  border-left: 2px solid var(--gold); background: rgba(227,177,88,0.05); border-radius: 0 8px 8px 0;
}
.sd-chips.open { display: flex; flex: 1 0 100%; }
.sd-chip {
  font-size: 11.5px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 6px; padding: 4px 9px; cursor: pointer;
}
.sd-chip:hover { border-color: var(--gold); color: var(--text); }

.sd-input {
  width: 100%; background: transparent; border: none; color: var(--text);
  padding: 10px 0 0; font-size: 18px; font-family: var(--serif); cursor: default;
}
.sd-input:focus { outline: none; }

.sd-listen-btn-wide {
  width: 100%; margin-top: 4px; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--gold); font-size: 14.5px; font-weight: 600; cursor: pointer; font-family: var(--sans);
}
.sd-listen-btn-wide:hover:not(:disabled) { border-color: var(--gold); }
.sd-listen-btn-wide:disabled { opacity: .35; cursor: not-allowed; color: var(--text-faint); }

.sd-empty-hint { color: var(--text-faint); font-size: 14px; font-family: var(--sans); }

.sd-target-preview { font-family: var(--serif); font-size: 19px; margin: 10px 0 4px; }
.sd-target-preview .orig { color: var(--text-faint); font-size: 14px; }
.sd-target-preview .hl { border-bottom: 2px solid var(--blue); color: var(--blue); padding-bottom: 1px; }
.sd-target-preview .hl[data-rule="경음화"] { border-bottom-color: var(--gold); color: var(--gold); }
.sd-target-preview .hl[data-rule="비음화"] { border-bottom-color: var(--blue); color: var(--blue); }
.sd-target-preview .hl[data-rule="연음"], .sd-target-preview .hl[data-rule="연음(겹받침)"] { border-bottom-color: var(--teal); color: var(--teal); }
.sd-target-preview .hl[data-rule="격음화"] { border-bottom-color: var(--purple); color: var(--purple); }
.sd-target-preview .hl[data-rule="유음화"] { border-bottom-color: var(--rose); color: var(--rose); }
.sd-target-preview .hl[data-rule="ㅎ탈락"] { border-bottom-color: var(--gray); color: var(--gray); }
.sd-rule-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sd-rule-tag { font-family: var(--mono); font-size: 11px; border-radius: 999px; padding: 3px 9px; border: 1px solid; }
.sd-rule-tag[data-rule="경음화"]  { color: var(--gold);  border-color: var(--gold); }
.sd-rule-tag[data-rule="비음화"]  { color: var(--blue);  border-color: var(--blue); }
.sd-rule-tag[data-rule="연음"]    { color: var(--teal);  border-color: var(--teal); }
.sd-rule-tag[data-rule="연음(겹받침)"] { color: var(--teal); border-color: var(--teal); }
.sd-rule-tag[data-rule="격음화"]  { color: var(--purple);border-color: var(--purple); }
.sd-rule-tag[data-rule="유음화"]  { color: var(--rose);  border-color: var(--rose); }
.sd-rule-tag[data-rule="ㅎ탈락"]  { color: var(--gray);  border-color: var(--gray); }

.sd-record-row { display: flex; align-items: center; gap: 16px; }
.sd-mic-btn {
  width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--coral);
  background: var(--surface-2); color: var(--coral); font-size: 24px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .1s;
}
.sd-mic-btn:hover { transform: scale(1.05); }
.sd-mic-btn.recording { background: var(--coral); color: var(--surface); animation: sd-pulse 1.4s infinite; }
@keyframes sd-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(226,104,90,.5); } 50% { box-shadow: 0 0 0 10px rgba(226,104,90,0); } }
.sd-record-meta { flex: 1; }
.sd-record-status { font-size: 13.5px; color: var(--text-dim); margin-bottom: 6px; }
.sd-meter { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.sd-meter-fill { height: 100%; background: var(--coral); width: 0%; transition: width .05s linear; }
.sd-playback { margin-top: 14px; }
.sd-playback audio { width: 100%; height: 34px; }

.sd-btn {
  background: var(--gold); color: #201705; border: none; border-radius: 8px;
  padding: 11px 20px; font-size: 14.5px; font-weight: 700; cursor: pointer; font-family: var(--sans);
}
.sd-btn:hover { filter: brightness(1.08); }
.sd-btn:disabled { opacity: .4; cursor: not-allowed; }
.sd-btn.secondary { background: #3a4258; border: 2px solid transparent; color: #eef0f4; font-weight: 700; }
.sd-btn.secondary:hover { border-color: var(--gold); color: var(--gold); }
.sd-diagnose-row { margin-top: 16px; display: flex; gap: 10px; }

.sd-result { margin-top: 18px; }
.sd-stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.sd-stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; min-width: 90px; text-align: center; }
.sd-stat .num { font-family: var(--serif); font-size: 22px; color: var(--gold); }
.sd-stat .label { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }
.sd-word-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.sd-word-card.flagged { border-color: var(--coral); background: rgba(226,104,90,0.06); }
.sd-word-text { font-family: var(--serif); font-size: 19px; min-width: 70px; }
.sd-word-score { font-family: var(--mono); font-size: 13px; color: var(--text-dim); }
.sd-word-cat { font-family: var(--mono); font-size: 11.5px; color: var(--coral); background: rgba(226,104,90,0.1); border: 1px solid rgba(226,104,90,0.35); border-radius: 999px; padding: 3px 10px; }
.sd-word-ok { font-family: var(--mono); font-size: 11.5px; color: var(--teal); }
.sd-error-box { background: var(--surface-2); border-left: 2px solid var(--coral); border-radius: 4px; padding: 12px 14px; font-size: 13px; color: var(--text-dim); margin-top: 12px; white-space: pre-line; }
.sd-custom-hint { font-size: 12px; color: var(--text-faint); margin: 0 0 10px; }
.sd-custom-row { display: flex; gap: 8px; }
.sd-char-count { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); text-align: right; margin-top: 4px; }
.sd-char-count.limit { color: var(--coral); }
.ja-translate-box { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
.ja-translate-row { display: flex; gap: 8px; margin-bottom: 8px; font-size: 14.5px; align-items: baseline; }
.ja-translate-label { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); width: 90px; flex-shrink: 0; }
.ja-translate-value { font-family: var(--serif); color: var(--text); }
.ja-translate-value.faint { color: var(--text-dim); font-family: var(--sans); font-size: 13px; }
.sd-input-editable {
  flex: 1; background: #eef0f4; border: 2px solid transparent; color: #1a1d24;
  border-radius: 8px; padding: 11px 13px; font-size: 15px; font-family: var(--sans);
}
.sd-input-editable:focus { outline: none; border-color: var(--gold); }
.sd-input-editable::placeholder { color: #565d6b; }

.an-stat-row { display: flex; gap: 10px; margin-bottom: 16px; }
.an-stat { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
.an-stat .num { font-family: var(--serif); font-size: 26px; color: var(--gold); }
.an-stat .label { font-family: var(--mono); font-size: 11px; color: var(--text-faint); margin-top: 4px; }
.an-summary {
  background: rgba(227,177,88,0.06); border: 1px solid rgba(227,177,88,0.3); border-radius: 10px;
  padding: 14px 16px; font-size: 14px; line-height: 1.6; margin-bottom: 18px;
}
.an-rule-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.an-rule-row { display: flex; align-items: center; gap: 10px; }
.an-rule-name { font-family: var(--sans); font-size: 13px; color: var(--text-dim); width: 110px; flex-shrink: 0; }
.an-bar-track { flex: 1; height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.an-bar-fill { height: 100%; border-radius: 999px; background: var(--gold); }
.an-bar-fill[data-rule="경음화"] { background: var(--gold); }
.an-bar-fill[data-rule="비음화"] { background: var(--blue); }
.an-bar-fill[data-rule="연음"], .an-bar-fill[data-rule="연음(겹받침)"] { background: var(--teal); }
.an-bar-fill[data-rule="격음화"] { background: var(--purple); }
.an-bar-fill[data-rule="유음화"] { background: var(--rose); }
.an-bar-fill[data-rule="ㅎ탈락"] { background: var(--gray); }
.an-rule-score { font-family: var(--mono); font-size: 12px; color: var(--text-faint); width: 36px; text-align: right; flex-shrink: 0; }
.an-empty { text-align: center; padding: 30px 10px; color: var(--text-faint); font-size: 14px; }

/* ===== 회화 연습 (cv-*) ===== */
.cv-scenario-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.cv-scenario-chip {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
  cursor: pointer; flex: 1; min-width: 160px; text-align: center;
}
.cv-scenario-chip:hover { border-color: var(--gold); }
.cv-scenario-chip.active { border-color: var(--gold); background: rgba(227,177,88,0.08); }
.cv-scenario-chip .icon { font-size: 26px; margin-bottom: 6px; }
.cv-scenario-chip .name { font-size: 13.5px; color: var(--text-dim); }

.cv-thread { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; min-height: 40px; }
.cv-row { display: flex; gap: 10px; align-items: flex-end; }
.cv-row.user { flex-direction: row-reverse; }
.cv-avatar {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 16px; border: 1px solid var(--border);
}
.cv-bubble { max-width: 74%; padding: 10px 14px; border-radius: 14px; font-family: var(--serif); font-size: 16.5px; }
.cv-row.partner .cv-bubble { background: var(--surface-2); border-bottom-left-radius: 3px; }
.cv-row.user .cv-bubble { background: rgba(227,177,88,0.14); border: 1px solid rgba(227,177,88,0.3); border-bottom-right-radius: 3px; }
.cv-bubble .cv-play {
  display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 11.5px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px; cursor: pointer; color: var(--gold);
}
.cv-bubble .cv-score { font-family: var(--mono); font-size: 11px; color: var(--text-faint); margin-top: 6px; }
.cv-bubble .cv-cat { font-family: var(--mono); font-size: 10.5px; color: var(--coral); background: rgba(226,104,90,0.1); border: 1px solid rgba(226,104,90,0.35); border-radius: 999px; padding: 2px 8px; margin-top: 4px; display: inline-block; }
.cv-bubble .cv-ok { font-family: var(--mono); font-size: 10.5px; color: var(--teal); margin-top: 4px; display: inline-block; }

.cv-action { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 6px; }
.cv-action .hint { font-size: 12.5px; color: var(--text-faint); margin-bottom: 10px; }
.cv-record-row { display: flex; align-items: center; gap: 14px; }
.cv-mic-btn {
  width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--coral);
  background: var(--surface-2); color: var(--coral); font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.cv-mic-btn.recording { background: var(--coral); color: var(--surface); animation: cv-pulse 1.4s infinite; }
@keyframes cv-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(226,104,90,.5); } 50% { box-shadow: 0 0 0 9px rgba(226,104,90,0); } }
.cv-meter { height: 5px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 4px; }
.cv-meter-fill { height: 100%; background: var(--coral); width: 0%; }
.cv-record-status { font-size: 13px; color: var(--text-dim); }

.cv-btn { background: var(--gold); color: #201705; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.cv-btn:disabled { opacity: .4; cursor: not-allowed; }
.cv-btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); font-weight: 500; }
.cv-btn-row { display: flex; gap: 8px; margin-top: 12px; }
.cv-done { text-align: center; padding: 24px; color: var(--text-dim); font-family: var(--serif); font-size: 17px; }

.cv-detail-toggle { display: inline-block; margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--gold); cursor: pointer; border-bottom: 1px dotted var(--gold); }
.cv-detail-panel { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.cv-stat-row { display: flex; gap: 6px; margin-bottom: 10px; }
.cv-stat { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 4px; text-align: center; }
.cv-stat .num { font-family: var(--serif); font-size: 16px; color: var(--gold); }
.cv-stat .label { font-family: var(--mono); font-size: 9px; color: var(--text-faint); margin-top: 1px; }

<script>
(function(){
  // ================= 규칙 엔진 (검증된 로직, 양쪽 뷰 공유) =================
  const BASE = 0xAC00;
  const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const JONG = ['', 'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const isHangul = ch => { const c = ch.codePointAt(0); return c >= 0xAC00 && c <= 0xD7A3; };
  const decompose = ch => { const code = ch.codePointAt(0) - BASE; return { cho: CHO[Math.floor(code/28/21)], jung: JUNG[Math.floor(code/28)%21], jong: JONG[code%28] }; };
  const compose = (cho,jung,jong) => String.fromCodePoint(BASE + (CHO.indexOf(cho)*21 + JUNG.indexOf(jung))*28 + JONG.indexOf(jong||''));
  const NEUTRALIZE = {'':'','ㄱ':'ㄱ','ㄲ':'ㄱ','ㄳ':'ㄱ','ㄴ':'ㄴ','ㄵ':'ㄴ','ㄶ':'ㄴ','ㄷ':'ㄷ','ㄹ':'ㄹ','ㄺ':'ㄱ','ㄻ':'ㅁ','ㄼ':'ㄹ','ㄽ':'ㄹ','ㄾ':'ㄹ','ㄿ':'ㅂ','ㅀ':'ㄹ','ㅁ':'ㅁ','ㅂ':'ㅂ','ㅄ':'ㅂ','ㅅ':'ㄷ','ㅆ':'ㄷ','ㅇ':'ㅇ','ㅈ':'ㄷ','ㅊ':'ㄷ','ㅋ':'ㄱ','ㅌ':'ㄷ','ㅍ':'ㅂ','ㅎ':'ㄷ'};
  const COMPOUND_SPLIT = {'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅄ':['ㅂ','ㅅ']};
  const TENSE = {'ㄱ':'ㄲ','ㄷ':'ㄸ','ㅂ':'ㅃ','ㅅ':'ㅆ','ㅈ':'ㅉ'};
  const NASAL = {'ㄱ':'ㅇ','ㄷ':'ㄴ','ㅂ':'ㅁ'};
  const ASPIRATE = {'ㄱ':'ㅋ','ㄷ':'ㅌ','ㅂ':'ㅍ','ㅈ':'ㅊ'};

  function applyRules(text){
    const syll = [...text].map(ch => isHangul(ch) ? decompose(ch) : ch);
    const notes = [];
    for (let i = 0; i < syll.length - 1; i++){
      const cur = syll[i], next = syll[i+1];
      if (typeof cur === 'string' || typeof next === 'string') continue;
      if (cur.jong === '') continue;
      if (next.cho === 'ㅇ'){
        if (cur.jong === 'ㅇ') continue;
        if (cur.jong === 'ㅎ'){ cur.jong = ''; notes.push({pos:i, rule:'ㅎ탈락'}); continue; }
        if (cur.jong === 'ㄶ'){ next.cho = 'ㄴ'; cur.jong = ''; notes.push({pos:i, rule:'ㅎ탈락'}); continue; }
        if (cur.jong === 'ㅀ'){ next.cho = 'ㄹ'; cur.jong = ''; notes.push({pos:i, rule:'ㅎ탈락'}); continue; }
        if (COMPOUND_SPLIT[cur.jong]){ const [stay, moved] = COMPOUND_SPLIT[cur.jong]; cur.jong = stay; next.cho = moved; notes.push({pos:i, rule:'연음(겹받침)'}); }
        else { next.cho = cur.jong; cur.jong = ''; notes.push({pos:i, rule:'연음'}); }
        continue;
      }
      if (cur.jong === 'ㅎ' && ASPIRATE[next.cho]){ next.cho = ASPIRATE[next.cho]; cur.jong = ''; notes.push({pos:i, rule:'격음화'}); continue; }
      { const neu0 = NEUTRALIZE[cur.jong]; if (next.cho === 'ㅎ' && ASPIRATE[neu0]){ next.cho = ASPIRATE[neu0]; cur.jong = ''; notes.push({pos:i, rule:'격음화'}); continue; } }
      const neu = NEUTRALIZE[cur.jong];
      if (neu === 'ㄴ' && next.cho === 'ㄹ'){ cur.jong = 'ㄹ'; notes.push({pos:i, rule:'유음화'}); continue; }
      if (neu === 'ㄹ' && next.cho === 'ㄴ'){ next.cho = 'ㄹ'; notes.push({pos:i, rule:'유음화'}); continue; }
      if (NASAL[neu] && (next.cho === 'ㄴ' || next.cho === 'ㅁ')){ cur.jong = NASAL[neu]; notes.push({pos:i, rule:'비음화'}); continue; }
      if (TENSE[next.cho] && ['ㄱ','ㄷ','ㅂ'].includes(neu)){ cur.jong = neu; next.cho = TENSE[next.cho]; notes.push({pos:i, rule:'경음화'}); continue; }
      if (neu !== cur.jong) cur.jong = neu;
    }
    for (let i = 0; i < syll.length; i++){
      const s = syll[i]; if (typeof s !== 'object') continue;
      const next = syll[i+1];
      if (i === syll.length - 1 || typeof next !== 'object') s.jong = NEUTRALIZE[s.jong];
    }
    const result = syll.map(s => typeof s === 'string' ? s : compose(s.cho, s.jung, s.jong)).join('');
    return { result, notes };
  }

    pickSentenceHint: { ko: '위에서 문장을 먼저 골라주세요.', ja: '上で文を選んでください。' },
    listenBtnWide: { ko: '🔊 발음 듣기', ja: '🔊 発音を聞く' },
    recordIdle: { ko: '마이크 버튼을 눌러 녹음을 시작하세요', ja: 'マイクのボタンを押して録音を始めてください' },
    recordDenied: { ko: '마이크 권한이 거부됐어요. 브라우저 주소창 옆 마이크 아이콘에서 허용해주세요.', ja: 'マイクの使用が許可されていません。ブラウザのアドレスバー横のマイクのアイコンから許可してください。' },

    },

  // 일본어권 한국어 교재에서 통용되는 한자어 용어. 100% 검증은 못 했으니

  function t(key, ...args){
    const entry = STRINGS[key];
    if (!entry) return key;
    const val = entry[lang];
    return typeof val === 'function' ? val(...args) : val;
  }
  function ruleLabel(name){ return (RULE_LABELS[name] && RULE_LABELS[name][lang]) || name; }
  function categoryLabel(name){ return (CATEGORY_LABELS[name] && CATEGORY_LABELS[name][lang]) || name; }
  function applyStaticI18n(){
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const val = t(el.dataset.i18n);
      if (el.tagName === 'INPUT') el.placeholder = val; else el.textContent = val;
    });

  // ================= TTS (양쪽 뷰 공유) =================
  const ttsCache = new Map();
  async function playTTS(sentence, triggerEl){
    if (!sentence) return;
    if (triggerEl) triggerEl.style.opacity = '0.5';
    try {
      if (ttsCache.has(sentence)) { await new Audio(ttsCache.get(sentence)).play(); return; }
      const backendUrl = document.getElementById('backendUrl').value.trim().replace(/\/$/, '');
      const res = await fetch(`${backendUrl}/api/pronunciation/tts`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sentence }),
      });
      if (!res.ok) {
        let detail = '';
        try { const errJson = await res.json(); detail = errJson.error || ''; } catch (e2) {}
        throw new Error(`(${res.status}) ${detail}`);
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      ttsCache.set(sentence, url);
      await new Audio(url).play();
    } catch (err) {
      console.error(err);
      alert(t('ttsFailed') + '\n\n' + err.message);
    } finally {
      if (triggerEl) triggerEl.style.opacity = '1';
    }
  }

  // ================= 학습 기록 (localStorage) =================
  const HISTORY_KEY = 'shadowing_history_v1';
  function loadHistory(){
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch (e) { return []; }
  }
  function saveHistoryRecord(record){
    const hist = loadHistory();
    hist.push(record);
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(hist)); } catch (e) { console.error('history save failed', e); }
  }
  function findCategoryOf(sentence){
    for (const [cat, list] of Object.entries(CURRICULUM)) { if (list.includes(sentence)) return cat; }
    return null; // 커리큘럼에 없으면 커스텀 입력으로 간주
  }
  // ================= Supabase Auth (로그인/회원가입/게스트) =================
  let supabaseAuthClient = null;
  let currentSession = null;
  let useLocalStorageForSession = localStorage.getItem('remember_me_pref') !== 'no'; // 기본값: 유지

  function getAuthClient(){
    if (supabaseAuthClient) return supabaseAuthClient;
    const url = document.getElementById('supabaseUrlInput').value.trim();
    const key = document.getElementById('supabaseAnonKeyInput').value.trim();
    if (!url || !key) return null;
    const dynamicStorage = {
      getItem: (k) => (useLocalStorageForSession ? localStorage : sessionStorage).getItem(k),
      setItem: (k, v) => (useLocalStorageForSession ? localStorage : sessionStorage).setItem(k, v),
      removeItem: (k) => (useLocalStorageForSession ? localStorage : sessionStorage).removeItem(k),
    };
    supabaseAuthClient = supabase.createClient(url, key, {
      auth: { storage: dynamicStorage, persistSession: true, autoRefreshToken: true },
    });
    supabaseAuthClient.auth.onAuthStateChange((_event, session) => {
      currentSession = session;
      updateAccountUI();
    });
    return supabaseAuthClient;
  }

  function isLoggedIn(){ return !!(currentSession && currentSession.user); }
  function currentUserId(){ return isLoggedIn() ? currentSession.user.id : null; }
  function currentUserEmail(){ return isLoggedIn() ? currentSession.user.email : null; }

  function updateAccountUI(){
    const statusEl = document.getElementById('accountStatus');
    const actionBtn = document.getElementById('accountActionBtn');
    if (isLoggedIn()) {
      statusEl.textContent = t('loggedInAs', currentUserEmail());
      actionBtn.textContent = t('logoutBtn');
      actionBtn.onclick = doLogout;
    } else {
      statusEl.textContent = t('guestStatus');
      actionBtn.textContent = t('loginSignupBtn');
      actionBtn.onclick = openAuthModal;
    }
  }

  async function doLogout(){
    const client = getAuthClient();
    if (client) await client.auth.signOut();
    currentSession = null;
    updateAccountUI();
  }

  function openAuthModal(){ document.getElementById('authModal').style.display = 'flex'; }
  function closeAuthModal(){ document.getElementById('authModal').style.display = 'none'; }

  let authMode = 'login';
  function setAuthMode(mode){
    authMode = mode;
    document.getElementById('authTabLogin').classList.toggle('active', mode === 'login');
    document.getElementById('authTabSignup').classList.toggle('active', mode === 'signup');
    document.getElementById('authConsentNote').style.display = mode === 'signup' ? 'block' : 'none';
    document.getElementById('authSubmitBtn').textContent = t(mode === 'login' ? 'authTabLogin' : 'authTabSignup');
    document.getElementById('authError').style.display = 'none';

  document.getElementById('authTabLogin').addEventListener('click', () => setAuthMode('login'));
  document.getElementById('authTabSignup').addEventListener('click', () => setAuthMode('signup'));
  document.getElementById('authGuestBtn').addEventListener('click', closeAuthModal);

  document.getElementById('authSubmitBtn').addEventListener('click', async () => {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const remember = document.getElementById('authRememberMe').checked;
    const errorEl = document.getElementById('authError');
    errorEl.style.display = 'none';

    const client = getAuthClient();
    if (!client) {
      errorEl.textContent = t('supabaseNotConfigured');
      errorEl.style.display = 'block';
      return;
    }
    useLocalStorageForSession = remember;
    localStorage.setItem('remember_me_pref', remember ? 'yes' : 'no');

    try {
      const { data, error } = authMode === 'login'
        ? await client.auth.signInWithPassword({ email, password })
        : await client.auth.signUp({ email, password });
      if (error) throw error;
      currentSession = data.session;
      updateAccountUI();
      closeAuthModal();
    } catch (err) {
      errorEl.textContent = err.message || String(err);
      errorEl.style.display = 'block';
    }
  });

  function recordDiagnosis(data, meta, audioBlob){
    if (!isLoggedIn()) return; // 게스트는 기록을 남기지 않는다 (로컬/서버 둘 다)

    const words = data.words || [];
    const ruleHits = [];
    words.forEach(w => (w.relatedRules || []).forEach(r => {
      ruleHits.push({ rule: r, score: w.accuracyScore, flagged: !!w.estimatedCategory });
    }));
    saveHistoryRecord({
      ts: Date.now(), mode: meta.mode, sentence: meta.sentence, category: meta.category,
      overall: data.overall || {}, ruleHits,
    });

    const backendUrl = document.getElementById('backendUrl').value.trim().replace(/\/$/, '');
    const form = new FormData();
    if (audioBlob) form.append('audio', audioBlob, 'attempt.wav');
    form.append('userId', currentUserId());
    form.append('mode', meta.mode);
    form.append('sentence', meta.sentence);
    if (meta.category) form.append('category', meta.category);
    form.append('lang', lang);
    form.append('overall', JSON.stringify(data.overall || {}));
    form.append('ruleHits', JSON.stringify(ruleHits));
    fetch(`${backendUrl}/api/history`, { method: 'POST', body: form })
      .catch(err => console.error('중앙 기록 업로드 실패(로컬 기록은 정상 저장됨):', err));
  }

  function renderAnalytics(){
    const hist = loadHistory();
    const wrap = document.getElementById('analyticsWrap');
    if (hist.length === 0){
      wrap.innerHTML = `<div class="an-empty">${isLoggedIn() ? t('noHistoryYet') : t('noHistoryYetGuest')}</div>`;
      return;
    }
    const totalCount = hist.length;
    const avgOverall = Math.round((hist.reduce((s, h) => s + (h.overall.PronScore || 0), 0) / totalCount) * 10) / 10;

    const ruleStats = {};
    hist.forEach(h => {
      (h.ruleHits || []).forEach(hit => {
        if (!ruleStats[hit.rule]) ruleStats[hit.rule] = { count: 0, flagged: 0, scoreSum: 0, scoreCount: 0 };
        const s = ruleStats[hit.rule];
        s.count++;
        if (hit.flagged) s.flagged++;
        if (typeof hit.score === 'number') { s.scoreSum += hit.score; s.scoreCount++; }
      });
    });
    const ruleRows = Object.entries(ruleStats).map(([rule, s]) => ({
      rule,
      avg: s.scoreCount ? Math.round(s.scoreSum / s.scoreCount) : null,
      flagRate: s.count ? Math.round((s.flagged / s.count) * 100) : 0,
      count: s.count,
    })).sort((a, b) => (a.avg ?? 100) - (b.avg ?? 100));

    let summaryHtml = '';
    if (ruleRows.length){
      const worst = ruleRows[0];
      summaryHtml = `<div class="an-summary">${t('summaryTemplate', ruleLabel(worst.rule), worst.avg ?? '–', worst.flagRate)}</div>`;
    }

    wrap.innerHTML = `
      <div class="an-stat-row">
        <div class="an-stat"><div class="num">${totalCount}</div><div class="label">${t('totalPractice')}</div></div>
        <div class="an-stat"><div class="num">${avgOverall}</div><div class="label">${t('avgScore')}</div></div>
      </div>
      ${summaryHtml}
      <div class="an-rule-list">
        ${ruleRows.map(r => `
          <div class="an-rule-row">
            <span class="an-rule-name">${ruleLabel(r.rule)}</span>
            <div class="an-bar-track"><div class="an-bar-fill" data-rule="${r.rule}" style="width:${r.avg ?? 0}%"></div></div>
            <span class="an-rule-score">${r.avg ?? '–'}${t('scoreUnit')}</span>
          </div>
        `).join('')}
      </div>
      <button class="sd-btn secondary" id="resetHistoryBtn">${t('resetHistory')}</button>
    `;
    document.getElementById('resetHistoryBtn').addEventListener('click', () => {
      if (confirm(t('resetConfirm'))) { localStorage.removeItem(HISTORY_KEY); renderAnalytics(); }
    });
  }

  function renderTargetPreview(sentence, els){
    if (!sentence){
      els.preview.innerHTML = `<span class="sd-empty-hint">${t('pickSentenceHint')}</span>`;
      els.tagWrap.innerHTML = '';
      if (els.listenBtn) els.listenBtn.disabled = true;
      return;
    }
    if (els.listenBtn) els.listenBtn.disabled = false;
    const { result, notes } = applyRules(sentence);
    const ruleByIndex = new Map();
    notes.forEach(n => {
      if (!ruleByIndex.has(n.pos)) ruleByIndex.set(n.pos, n.rule);
      if (!ruleByIndex.has(n.pos + 1)) ruleByIndex.set(n.pos + 1, n.rule);
    });
    const spans = [...result].map((ch, i) => {
      if (ch === sentence[i]) return ch;
      const rule = ruleByIndex.get(i) || '';
      return `<span class="hl" data-rule="${rule}">${ch}</span>`;
    }).join('');
    els.preview.innerHTML = `<span class="orig">${sentence}</span><br>${spans}`;
    els.tagWrap.innerHTML = '';
    notes.forEach(n => { const tag = document.createElement('span'); tag.className = 'sd-rule-tag'; tag.dataset.rule = n.rule; tag.textContent = ruleLabel(n.rule); els.tagWrap.appendChild(tag); });
  }

  function updateTarget(){
    const sentence = document.getElementById('sentenceInput').value.trim();
    renderTargetPreview(sentence, {
      preview: document.getElementById('targetPreview'),
      tagWrap: document.getElementById('ruleTags'),
      listenBtn: document.getElementById('listenBtn'),

  function encodeWav(chunks, sampleRate){
    let total = 0; chunks.forEach(c => total += c.length);
    const merged = new Float32Array(total);
    let off = 0; chunks.forEach(c => { merged.set(c, off); off += c.length; });
    const buffer = new ArrayBuffer(44 + merged.length * 2);
    const view = new DataView(buffer);
    function writeStr(o, s){ for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); }
    writeStr(0, 'RIFF'); view.setUint32(4, 36 + merged.length * 2, true); writeStr(8, 'WAVE');
    writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    writeStr(36, 'data'); view.setUint32(40, merged.length * 2, true);
    let idx = 44;
    for (let i = 0; i < merged.length; i++, idx += 2){
      let s = Math.max(-1, Math.min(1, merged[i]));
      view.setInt16(idx, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return new Blob([view], { type: 'audio/wav' });
  }

      <div class="cv-detail-toggle">${t('detailShow')} ▾</div>
      <div class="cv-detail-panel" style="display:none">
        <div class="cv-stat-row">${statHtml}</div>
        <div class="cv-word-list">${wordsHtml}</div>
      </div>
    `;

    bubbleEl.querySelector('.cv-play').addEventListener('click', (e) => playTTS(sentence, e.currentTarget));
    const toggle = bubbleEl.querySelector('.cv-detail-toggle');
    const panel = bubbleEl.querySelector('.cv-detail-panel');
    let open = false;
    toggle.addEventListener('click', () => {
      open = !open;
      panel.style.display = open ? 'block' : 'none';
      toggle.textContent = open ? `${t('detailHide')} ▴` : `${t('detailShow')} ▾`;
    });
  }

  // ================= 언어 토글 (양쪽 뷰 공유) =================
  document.getElementById('langJa').addEventListener('click', () => setLang('ja'));
  document.getElementById('langKo').addEventListener('click', () => setLang('ko'));
  function setLang(next){
    lang = next;
    document.getElementById('langJa').classList.toggle('active', lang === 'ja');
    document.getElementById('langKo').classList.toggle('active', lang === 'ko');
    applyStaticI18n();
    updateAccountUI();
    setAuthMode(authMode);

    // 문장 연습 뷰 갱신
    updateRecordStatusText();
    renderChips();
    updateTarget();
    if (lastResultData) renderResult(lastResultData);

    // 커스텀 문장 뷰 갱신
    updateCustomTarget();
    updateCustomRecordStatusText();

    // 회화 연습 뷰 갱신 (진행 중이던 대화는 언어가 섞이지 않도록 초기화)
    renderScenarios();
    if (currentScenarioKey) { cvThread.innerHTML = ''; lineIndex = 0; showNextLine(); }
  }

  // ================= 초기화 =================
  async function initAuth(){
    const client = getAuthClient();
    if (!client) { updateAccountUI(); return; } // 아직 설정 안 됨 → 게스트 상태로 표시
    const { data } = await client.auth.getSession();
    currentSession = data.session;
    updateAccountUI();
  }
  initAuth();

  setMode('home');
  setLang(lang);
  setAuthMode('login');
  updateTarget();
})();
</script>
</body>
</html>
